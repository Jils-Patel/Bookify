<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Bookify - Login</title>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
</head>
<body>
    <header class="home-header">
        <nav class="home-navbar">
            <div class="container">
                <a href="/" class="app-logo">Bookify</a>
                <div class="nav-right">
                    <a href="/Login" class="signin-button">
                        Sign In
                    </a>
                </div>
            </div>
        </nav>
    </header>
    
    <div class="main-wrapper">
        <div class="login-container">
            <h1 class="login-title">Welcome to Bookify</h1>
            
            <div class="login-buttons">
                <!-- Firebase will be initialized in this page -->
                <div id="firebaseAuthContainer"></div>
                
                <!-- Alternative direct Google sign-in button -->
                <a href="#" class="google-signin-button" onclick="signInWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                    Sign in with Google
                </a>
            </div>
            
            <a href="/" class="back-to-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>
    
    <footer class="home-footer">
        <div class="container">
            <div class="footer-simple">
                <p>&copy; 2025 Bookify. All rights reserved - <a href="/Terms">Terms & Conditions</a> - <a href="/Privacy">Privacy Policy</a></p>
            </div>
        </div>
    </footer>
    
    <script>
        // Function to handle Google Sign-In
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    // Get the user object
                    const user = result.user;
                    
                    // Get the proper Firebase ID token
                    return user.getIdToken().then(idToken => {
                        // Send the token to the server
                        return fetch('/process_firebase_token', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ id_token: idToken })
                        });
                    });
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/';
                    } else {
                        alert('Authentication failed: ' + data.error);
                    }
                })
                .catch((error) => {
                    // Handle errors
                    alert('Error during authentication: ' + error.message);
                });
        }
    </script>
</body>
</html>
