<!DOCTYPE html>
<html>
    <head>
        <title>Bookify - Quick Search</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/quick_search.css') }}">
    </head>
    <body>
        <div class="app-layout">
            <div class="side-navbar" id="sideNavbar">
                <button id="navbarClose" class="navbar-close">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="/Home" class="nav-link" title="Home">
                    <i class="fas fa-home"></i>
                </a>
                <a href="/Dashboard" class="nav-link" title="Dashboard">
                    <i class="fas fa-chart-pie"></i>
                </a>
                <a href="/Assistant" class="nav-link" title="AI Assistant">
                    <i class="fas fa-robot"></i>
                </a>
                <a href="/Quick_Search" class="nav-link active" title="Quick Search">
                    <i class="fas fa-search"></i>
                </a>
                <a href="/Tracker" class="nav-link" title="Book Tracker">
                    <i class="fa-solid fa-list-check"></i>
                </a>
                <a href="/Settings" class="nav-link" title="Settings">
                    <i class="fas fa-cog"></i>
                </a>
            </div>
            
            <div class="main-content">
                <div class="top-navbar">
                    <button id="menuToggle" class="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <a href="/Home" class="app-logo">Bookify</a>
                    
                    <div class="user-info" id="userProfile">
                        <div class="user-avatar">
                            {% if session['user']['avatar_url'] %}
                                <img src="{{ session['user']['avatar_url'] }}" alt="{{ session['user']['name'] }}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                            {% else %}
                                {{ session['user']['name'][0]|upper if session['user']['name'] else 'U' }}
                            {% endif %}
                        </div>
                        <div class="user-name">{{ session['user']['name'] }}</div>
                        <i class="fas fa-chevron-down" style="margin-left: 10px; color: rgba(255, 255, 255, 0.7);"></i>
                        
                        <div class="user-dropdown" id="userDropdown">
                            <a href="/Logout" class="dropdown-item">
                                <i class="fas fa-sign-out-alt"></i>
                                Sign Out
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="content-area">
                    <div class="search-container">
                        <div class="search-form">
                            <div class="form-group required">
                                <label for="searchSource">Source Type</label>
                                <select id="searchSource" class="form-input" required>
                                    <option value="books">Books</option>
                                    <option value="research">Research</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="searchQuery">Search Terms</label>
                                <input type="text" id="searchQuery" class="form-input" placeholder="Enter your search terms...">
                            </div>

                            <div class="form-group">
                                <label for="maxResults">Maximum Results</label>
                                <select id="maxResults" class="form-input">
                                    <option value="5">5</option>
                                    <option value="10">10</option>
                                    <option value="10">15</option>
                                    <option value="20">20</option>
                                    <option value="10">25</option>
                                    <option value="30">30</option>
                                    <option value="10">35</option>
                                    <option value="40">40</option>
                                    <option value="10">45</option>
                                    <option value="50">50</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <button id="searchButton" class="primary-button">
                                    <i class="fas fa-search"></i> Search
                                </button>
                            </div>
                        </div>

                        <div id="spinner" style="display: none; width: 100%; text-align: center; padding: 20px 0;">
                            <div style="display: inline-block; width: 60px; height: 60px; border: 4px solid transparent; border-top: 4px solid #4a90e2; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                            <div style="margin-top: 15px; color: #4a90e2; font-weight: 500; font-size: 22px;">Searching...</div>
                        </div>

                        <div class="results-container">
                            <div id="searchResults" class="results-grid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div id="bookModal" class="modal">
            <div class="modal-content">
                <div id="modalContent"></div>
            </div>
        </div>

        <!-- Firebase SDK -->
        <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
        <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
        
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
        <script src="{{ url_for('static', filename='js/quick_search.js') }}"></script>
        <script>
            // Toggle user dropdown
            document.getElementById('userProfile').addEventListener('click', function(e) {
                e.stopPropagation();
                document.getElementById('userDropdown').classList.toggle('active');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function() {
                document.getElementById('userDropdown').classList.remove('active');
                // Also close the side navbar if clicked outside
                if (!event.target.closest('#sideNavbar') && !event.target.closest('#menuToggle')) {
                    document.getElementById('sideNavbar').classList.remove('active');
                }
            });
            
            // Mobile menu toggle
            document.getElementById('menuToggle').addEventListener('click', function() {
                document.getElementById('sideNavbar').classList.toggle('active');
            });
            
            // Close side navbar on escape key
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    document.getElementById('sideNavbar').classList.remove('active');
                }
            });
            
            // Navbar close button
            document.getElementById('navbarClose').addEventListener('click', function() {
                document.getElementById('sideNavbar').classList.remove('active');
            });
        </script>
    </body>
</html>
