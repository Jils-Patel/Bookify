<!DOCTYPE html>
<html>
    <head>
        <title>Quick Search - Bookify</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/quick_search.css') }}">
    </head>
    <body>
        <div class="container">
            <nav class="navbar">
                <a href="/" class="nav-link" title="Book Discovery">
                    <i class="fas fa-book-open"></i>
                </a>
                <a href="/quick_search" class="nav-link active" title="Quick Search">
                    <i class="fas fa-search"></i>
                </a>
                <a href="/tracker" class="nav-link" title="Book Tracker">
                    <i class="fa-solid fa-list-check"></i>
                </a>
            </nav>

            <div class="search-container">
                <div class="search-form">
                    <div class="form-group required">
                        <label for="searchSource">Source Type</label>
                        <select id="searchSource" class="form-input" required>
                            <option value="books">Literature</option>
                            <option value="recent_research">Research</option>
                            <option value="archive">Archives</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="searchQuery">Search Terms</label>
                        <input type="text" id="searchQuery" class="form-input" placeholder="Enter your search terms...">
                    </div>

                    <div class="form-group">
                        <label for="maxResults">Maximum Results</label>
                        <select id="maxResults" class="form-input">
                            <option value="5">5 results</option>
                            <option value="10">10 results</option>
                            <option value="20">20 results</option>
                            <option value="30">30 results</option>
                            <option value="40">40 results</option>
                            <option value="50">50 results</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <button id="searchButton" class="primary-button">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </div>

                <div class="loading-spinner" style="display: none;">
                    <div class="spinner"></div>
                    <p>Searching...</p>
                </div>

                <div class="results-container">
                    <div id="searchResults" class="results-grid"></div>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div id="bookModal" class="modal">
            <div class="modal-content">
                <span class="close-button" onclick="closeModal()">&times;</span>
                <div id="modalContent"></div>
            </div>
        </div>

        <script src="{{ url_for('static', filename='js/quick_search.js') }}"></script>
    </body>
</html>
