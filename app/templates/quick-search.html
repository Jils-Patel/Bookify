<!-- Quick Search Modal -->
<div id="searchModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Quick Search</h2>
        <div class="search-container">
            <input type="text" id="quickSearchInput" placeholder="Search for books...">
            <button id="quickSearchButton">Search</button>
        </div>
        <div id="searchResults"></div>
    </div>
</div>

<script>
    // Quick Search Modal Functions
    const searchModal = document.getElementById('searchModal');
    const searchInput = document.getElementById('quickSearchInput');
    const searchButton = document.getElementById('quickSearchButton');
    const resultsContainer = document.getElementById('searchResults');
    const closeButton = document.querySelector('.modal .close');
    
    // Open the modal and focus on the input
    function openSearchModal() {
        searchModal.style.display = 'block';
        searchInput.focus();
    }
    
    // Close the modal
    function closeSearchModal() {
        searchModal.style.display = 'none';
    }
    
    // Handle search submission
    function handleSearch() {
        const query = searchInput.value.trim();
        if (query.length === 0) return;
        
        resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
        
        // Make the API call
        fetch(`/api/search?q=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                displaySearchResults(data);
            })
            .catch(error => {
                resultsContainer.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            });
    }
    
    // Display search results
    function displaySearchResults(data) {
        resultsContainer.innerHTML = '';
        
        if (!data || data.length === 0) {
            resultsContainer.innerHTML = '<p>No results found. Try a different search term.</p>';
            return;
        }
        
        // Create a container for the results
        const resultsGrid = document.createElement('div');
        resultsGrid.className = 'search-results-grid';
        
        // Add each book to the grid
        data.forEach(book => {
            const bookCard = createBookCard(book);
            resultsGrid.appendChild(bookCard);
        });
        
        resultsContainer.appendChild(resultsGrid);
    }
    
    // Create a book card for the search results
    function createBookCard(book) {
        const card = document.createElement('div');
        card.className = 'book-card';
        
        // Book cover
        const coverImg = document.createElement('img');
        coverImg.className = 'book-cover';
        coverImg.src = book.cover_url || '/static/images/default-cover.jpg';
        coverImg.alt = `Cover for ${book.title}`;
        coverImg.onerror = function() {
            this.src = '/static/images/default-cover.jpg';
        };
        
        // Book info container
        const infoContainer = document.createElement('div');
        infoContainer.className = 'book-info';
        
        // Title
        const title = document.createElement('h3');
        title.className = 'book-title';
        title.textContent = book.title;
        
        // Author
        const author = document.createElement('p');
        author.className = 'book-author';
        author.textContent = formatAuthorName(book.author);
        
        // Action buttons container
        const buttonsContainer = document.createElement('div');
        buttonsContainer.className = 'book-actions';
        
        // Read online button (OpenLibrary)
        const readButton = document.createElement('a');
        readButton.className = 'read-button';
        readButton.href = `https://openlibrary.org/search?q=${encodeURIComponent(book.title)}&mode=everything`;
        readButton.textContent = 'Find on OpenLibrary';
        readButton.target = '_blank';
        buttonsContainer.appendChild(readButton);
        
        // Add to collection button
        const addButton = document.createElement('button');
        addButton.className = 'add-button';
        addButton.textContent = 'Add to Collection';
        addButton.onclick = function() {
            addToCollection(book);
        };
        buttonsContainer.appendChild(addButton);
        
        // Assemble the card
        infoContainer.appendChild(title);
        infoContainer.appendChild(author);
        infoContainer.appendChild(buttonsContainer);
        
        card.appendChild(coverImg);
        card.appendChild(infoContainer);
        
        return card;
    }
    
    // Format author name function
    function formatAuthorName(author) {
        if (!author) return 'Unknown Author';
        if (Array.isArray(author)) {
            return author.join(', ');
        }
        return author;
    }
    
    // Add to collection function
    function addToCollection(book) {
        // This will be implemented later
        alert(`Added ${book.title} to your collection!`);
    }
    
    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
        // Search button click
        searchButton.addEventListener('click', handleSearch);
        
        // Enter key in search input
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
        
        // Close button click
        closeButton.addEventListener('click', closeSearchModal);
        
        // Click outside to close
        window.addEventListener('click', function(e) {
            if (e.target === searchModal) {
                closeSearchModal();
            }
        });
    });
</script>

    /* Loading and Error Styles */

</style>
