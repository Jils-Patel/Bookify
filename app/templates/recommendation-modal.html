<!-- Book Recommendation Modal -->
<div id="bookRecommendationModal" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>AI Book Recommendations</h2>
        <div id="recommendationResults"></div>
    </div>
</div>

<script>
    // Function to display book recommendations
    function displayBookRecommendation(book) {
        const resultsContainer = document.getElementById('recommendationResults');
        resultsContainer.innerHTML = '';

        if (!book) {
            resultsContainer.innerHTML = '<p>No recommendation found. Try another query.</p>';
            return;
        }

        // Main book container
        const bookContainer = document.createElement('div');
        bookContainer.className = 'book-recommendation';

        // Cover image
        const coverImg = document.createElement('img');
        coverImg.className = 'book-cover';
        coverImg.src = book.cover_url || '/static/images/default-cover.jpg';
        coverImg.alt = `Cover for ${book.title}`;
        coverImg.onerror = function() {
            this.src = '/static/images/default-cover.jpg';
        };

        // Book details container
        const detailsContainer = document.createElement('div');
        detailsContainer.className = 'modal-book-details';

        // Title
        const title = document.createElement('h3');
        title.textContent = book.title;

        // Author
        const author = document.createElement('p');
        author.className = 'author';
        author.textContent = formatAuthorName(book.author);

        // Description
        const description = document.createElement('p');
        description.className = 'description';
        description.textContent = book.description || 'No description available.';

        // Subjects
        const subjects = document.createElement('div');
        subjects.className = 'subjects';
        if (book.subjects && book.subjects.length > 0) {
            const subjectHeader = document.createElement('h4');
            subjectHeader.textContent = 'Subjects:';
            subjects.appendChild(subjectHeader);

            const subjectsList = document.createElement('ul');
            book.subjects.slice(0, 5).forEach(subject => {
                const subjectItem = document.createElement('li');
                subjectItem.textContent = subject;
                subjectsList.appendChild(subjectItem);
            });
            subjects.appendChild(subjectsList);
        }

        // Action buttons
        const actionButtons = document.createElement('div');
        actionButtons.className = 'action-buttons';

        // Read online button (OpenLibrary)
        const readButton = document.createElement('a');
        readButton.className = 'btn read-online-btn';
        readButton.href = `https://openlibrary.org/search?q=${encodeURIComponent(book.title)}&mode=everything`;
        readButton.textContent = 'Find on OpenLibrary';
        readButton.target = '_blank';
        actionButtons.appendChild(readButton);

        // Buy button if available
        if (book.buy_url) {
            const buyButton = document.createElement('a');
            buyButton.className = 'btn buy-btn';
            buyButton.href = book.buy_url;
            buyButton.textContent = 'Buy';
            buyButton.target = '_blank';
            actionButtons.appendChild(buyButton);
        }

        // Add to collection button
        const addButton = document.createElement('button');
        addButton.className = 'btn add-collection-btn';
        addButton.textContent = 'Add to Collection';
        addButton.onclick = function() {
            addBookToCollection(book);
        };
        actionButtons.appendChild(addButton);

        // Append all elements
        detailsContainer.appendChild(title);
        detailsContainer.appendChild(author);
        detailsContainer.appendChild(description);
        detailsContainer.appendChild(subjects);
        detailsContainer.appendChild(actionButtons);

        bookContainer.appendChild(coverImg);
        bookContainer.appendChild(detailsContainer);
        resultsContainer.appendChild(bookContainer);
    }

    // Format author name
    function formatAuthorName(author) {
        if (!author) return 'Unknown Author';
        if (Array.isArray(author)) {
            return author.join(', ');
        }
        return author;
    }

    // Function to add book to user's collection
    function addBookToCollection(book) {
        // Logic to add book to collection will go here
        alert('Book added to your collection!');
    }

    // Close modal when clicking the close button
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('bookRecommendationModal');
        const closeButton = modal.querySelector('.close-button');
        
        closeButton.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // Close modal when clicking outside of it
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    });
</script>
