<svg xmlns="http://www.w3.org/2000/svg" width="120" height="180" viewBox="0 0 120 180">
  <rect width="120" height="180" fill="#f8f9fa" />
  <rect x="10" y="10" width="100" height="160" fill="white" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Document Lines -->
  <rect x="25" y="40" width="70" height="3" fill="#e2e8f0" />
  <rect x="25" y="50" width="70" height="3" fill="#e2e8f0" />
  <rect x="25" y="60" width="70" height="3" fill="#e2e8f0" />
  <rect x="25" y="70" width="70" height="3" fill="#e2e8f0" />
  <rect x="25" y="80" width="70" height="3" fill="#e2e8f0" />
  <rect x="25" y="90" width="50" height="3" fill="#e2e8f0" />
  
  <!-- PDF icon at the bottom -->
  <rect x="40" y="110" width="40" height="50" fill="#e53e3e" rx="3" />
